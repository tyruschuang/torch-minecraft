name: Keep backend warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-backend-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping production API
        uses: actions/github-script@v7
        with:
          script: |
            const response = await fetch("https://torch-minecraft-api.vercel.app/ping");
            const body = await response.text();

            if (!response.ok || body.trim() !== '"pong"') {
              core.setFailed(`Unexpected response: ${response.status} ${body}`);
              return;
            }

            core.info("Torch API is warm.");
